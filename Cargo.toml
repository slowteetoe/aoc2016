[package]
name = "advent_of_code"
version = "0.12.0"
authors = ["Steven Lotito <steven.lotito@gmail.com>"]
edition = "2024"
default-run = "advent_of_code"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
doctest = false

[profile.dhat]
inherits = "release"
debug = 1

[features]
dhat-heap = ["dhat"]
today = ["chrono"]
test_lib = []

[dependencies]

# Template dependencies
chrono = { version = "0.4.38", optional = true }
dhat = { version = "0.3.3", optional = true }

pico-args = "0.5.0"

tinyjson = "2.5.1"

# Solution dependencies
itertools = "0.15.0"
rstest = "0.28.0"
regex = "1.13.1"
fast-md5 = "1.0.0"
hex = "0.4.3"
itoa = "1.0.19"
bitvec = "1.1.1"
anyhow = "1.0.105"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parse_day_4"
harness = false

[profile.bench]
debug = true
